name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: ['30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        if: ${{ !(matrix.os == 'windows-latest' && matrix.emacs-version == '31.1') }}
        with:
          version: ${{ matrix.emacs-version }}
      - name: Install Emacs 31.1 on Windows (direct download)
        if: ${{ matrix.os == 'windows-latest' && matrix.emacs-version == '31.1' }}
        shell: pwsh
        run: |
          curl.exe -L -f -o emacs.zip https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1_1.zip
          Expand-Archive emacs.zip -DestinationPath C:\emacs
          $exe = Get-ChildItem C:\emacs -Recurse -Filter emacs.exe | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Emacs version
        shell: bash
        run: emacs --version
      - name: Byte-compile
        shell: bash
        run: emacs -Q --batch -L . -f batch-byte-compile japanese-menu.el
      - name: ERT
        shell: bash
        run: emacs -Q --batch -L . -l ert -l japanese-menu-test.el -f ert-run-tests-batch-and-exit
