name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: ['30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Emacs version
        shell: bash
        run: emacs --version
      - name: Byte-compile
        shell: bash
        run: emacs -Q --batch -L . -f batch-byte-compile japanese-menu.el
      - name: ERT
        shell: bash
        run: emacs -Q --batch -L . -l ert -l japanese-menu-test.el -f ert-run-tests-batch-and-exit
